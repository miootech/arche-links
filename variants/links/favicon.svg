<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    arche.links favicon — three link "nodes" connected by lines.
    Solid amber center = the user. Outlined satellites = the links orbiting
    them. Works on both light and dark tab bars via the dark rounded bg.
  -->
  <defs>
    <linearGradient id="arche-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#arche-bg)"/>
  <circle cx="16" cy="16" r="5" fill="#e6b87a"/>
  <circle cx="7" cy="8" r="2.6" fill="none" stroke="#F5F5F7" stroke-width="1.8"/>
  <circle cx="25" cy="8" r="2.6" fill="none" stroke="#F5F5F7" stroke-width="1.8" opacity="0.7"/>
  <circle cx="16" cy="27" r="2.6" fill="none" stroke="#F5F5F7" stroke-width="1.8" opacity="0.5"/>
  <path d="M9 9.5L13 13.5M23 9.5L19 13.5M16 22V19" stroke="#e6b87a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
